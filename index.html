<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength Checker</title>
<style>
:root{--bg:#0f1b2d;--panel:#16273f;--line:#26405f;--text:#e6eef8;--muted:#8da2bc;--good:#3dd68c;--bad:#e5484d;--blue:#4c9aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#19385b,transparent 38%),var(--bg);color:var(--text);font:16px/1.5 Segoe UI,sans-serif}main{width:min(100%,520px)}h1{margin:0;font-size:clamp(1.8rem,6vw,2.4rem)}p{color:var(--muted)}.field,.checks{border:1px solid var(--line);background:var(--panel)}.field{display:flex;gap:8px;padding:12px}input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:1.1rem}button{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:transparent;color:var(--text);cursor:pointer}button:hover{border-color:var(--blue)}.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 8px}.segment{height:10px;background:var(--line)}.status{display:flex;justify-content:space-between;color:var(--muted)}.checks{display:grid;gap:7px;margin-top:20px;padding:16px}.check{color:var(--muted)}.check:before{content:'•';display:inline-block;width:24px}.check.ok{color:var(--good)}.check.ok:before{content:'✓'}.check.bad:before{content:'✗';color:var(--bad)}.suggestions{margin-top:18px;color:var(--muted);white-space:pre-line}.note{font-size:.85rem;margin-top:24px}
</style>
</head>
<body><main><h1>Password Strength Checker</h1><p>Type a password to check its basic resistance to guessing. Nothing is stored or sent.</p><div class="field"><input id="password" type="password" autocomplete="new-password" placeholder="Enter a password" autofocus><button id="toggle" type="button">Show</button><button id="clear" type="button">Clear</button></div><div class="meter"><i class="segment"></i><i class="segment"></i><i class="segment"></i><i class="segment"></i></div><div class="status"><strong id="strength">Waiting for input</strong><span id="score"></span></div><div class="checks" id="checks"></div><div class="suggestions" id="suggestions">Suggestions will appear as you type.</div><p class="note">Checked locally in your browser. This is an educational tool.</p></main>
<script>
const common=new Set(['password','password123','12345678','123456789','123456','qwerty','qwerty123','admin','admin123','abc123','letmein','welcome','iloveyou']),seq=['123','234','345','456','567','678','789','abc','bcd','cde','qwe','wer','ert'],labels=['At least 8 characters','12 or more characters','Uppercase letter','Lowercase letter','Number','Special character','Not a common password','No repeated characters','No predictable sequence'],input=document.querySelector('#password'),strength=document.querySelector('#strength'),score=document.querySelector('#score'),suggestions=document.querySelector('#suggestions'),segments=[...document.querySelectorAll('.segment')],checks=document.querySelector('#checks');checks.innerHTML=labels.map(x=>`<div class="check">${x}</div>`).join('');const items=[...checks.children];
function refresh(){const v=input.value;if(!v){strength.textContent='Waiting for input';strength.style.color='';score.textContent='';suggestions.textContent='Suggestions will appear as you type.';segments.forEach(x=>x.style.background='var(--line)');items.forEach(x=>x.className='check');return}const l=v.toLowerCase(),ok=[v.length>=8,v.length>=12,/[A-Z]/.test(v),/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v),!common.has(l),!/(.)\1\1/.test(v),!seq.some(x=>l.includes(x))];let n=(ok[1]?2:ok[0]?1:0)+ok.slice(2,6).filter(Boolean).length,feedback=[];if(!ok[1])feedback.push(ok[0]?'Use 12 or more characters for better security.':'Use at least 8 characters.');['Add an uppercase letter.','Add a lowercase letter.','Add a number.','Add a special character.'].forEach((x,i)=>{if(!ok[i+2])feedback.push(x)});if(!ok[6]){n=0;feedback.push('Avoid common or easily guessed passwords.')}if(!ok[7]){n=Math.max(0,n-1);feedback.push('Avoid repeating the same character many times.')}if(!ok[8]){n=Math.max(0,n-1);feedback.push('Avoid predictable sequences like 123 or abc.')}const level=n<=2?1:n<=4?2:n===5?3:4,label=['','Weak','Medium','Strong','Very strong'][level],color=['','var(--bad)','#f5a524','var(--good)','var(--blue)'][level];strength.textContent=label;strength.style.color=color;score.textContent=`Score ${n}/7 | ${v.length} characters`;segments.forEach((x,i)=>x.style.background=i<level?color:'var(--line)');items.forEach((x,i)=>x.className=`check ${ok[i]?'ok':'bad'}`);suggestions.textContent=feedback.length?feedback.map(x=>`- ${x}`).join('\n'):'No basic weaknesses detected.'}
input.addEventListener('input',refresh);document.querySelector('#toggle').onclick=e=>{input.type=input.type==='password'?'text':'password';e.target.textContent=input.type==='password'?'Show':'Hide'};document.querySelector('#clear').onclick=()=>{input.value='';input.focus();refresh()};refresh();
</script></body></html>
